services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: podotchet
      POSTGRES_USER: podotchet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podotchet"]
      interval: 2s
      retries: 30

  # Migrations run as a separate one-shot job BEFORE the API starts,
  # so a broken migration never takes down a running server.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://podotchet:${POSTGRES_PASSWORD}@db:5432/podotchet
    command: sh -c "alembic upgrade head && python seed.py"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://podotchet:${POSTGRES_PASSWORD}@db:5432/podotchet
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
